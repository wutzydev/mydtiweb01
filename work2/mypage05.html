<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <!-- HTML Element: Table (Block TAG) -->
    <h3>ตารางแบบที่ 1 : ทุกแถวมีจำนวนคอลัมน์เท่ากัน</h3>
    <table border="1" width="600px">
        <tr>
            <td>A</td>
            <td>A</td>
            <td>A</td>
            <td>A</td>
            <td>A</td>
        </tr>
        <tr>
            <td>B</td>
            <td>B</td>
            <td>B</td>
            <td>B</td>
            <td>B</td>
        </tr>
        <tr>
            <td>C</td>
            <td>C</td>
            <td>C</td>
            <td>C</td>
            <td>C</td>
        </tr>
        <tr>
            <td>D</td>
            <td>D</td>
            <td>D</td>
            <td>D</td>
            <td>D</td>
        </tr>
    </table>

    <!-- ################################################ -->
    <h3>ตารางแบบที่ 2 : ทุกแถวมีจำนวนคอลัมน์ไม่เท่ากัน</h3>
    <table border="1" width="600px">
        <tr>
            <td rowspan="2" colspan="2">A</td>
            <td colspan="2">B</td>
            <td>C</td>
        </tr>
        <tr>
            <td colspan="3">D</td>
        </tr>
        <tr>
            <td>E</td>
            <td rowspan="2">F</td>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            <td>J</td>
            <td>K</td>
            <td colspan="2">L</td>
        </tr>
    </table>

    <br><br><br><br><br><br>
</body>

</html>
